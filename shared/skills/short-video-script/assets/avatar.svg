<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad5)" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  
  <!-- Video Clapperboard & Play Button -->
  <g filter="url(#shadow5)" transform="translate(146, 120)">
    <!-- Clapperboard Body -->
    <rect width="220" height="250" rx="18" fill="#1E293B" stroke="#475569" stroke-width="2" />
    
    <!-- Clapper Stripes Header -->
    <path d="M0 12 Q0 0 12 0 L208 0 Q220 0 220 12 L220 48 L0 48 Z" fill="#0F172A" />
    <polygon points="20,0 45,0 15,48 0,48" fill="#F43F5E" />
    <polygon points="65,0 90,0 60,48 35,48" fill="#FFFFFF" />
    <polygon points="110,0 135,0 105,48 80,48" fill="#F43F5E" />
    <polygon points="155,0 180,0 150,48 125,48" fill="#FFFFFF" />
    <polygon points="200,0 220,0 195,48 170,48" fill="#F43F5E" />

    <!-- Big Play Button in Center -->
    <circle cx="110" cy="140" r="42" fill="url(#neonPink)" />
    <polygon points="100,122 100,158 130,140" fill="#FFFFFF" />

    <!-- Script Text Lines -->
    <rect x="25" y="200" width="80" height="8" rx="4" fill="#38BDF8" />
    <rect x="25" y="216" width="170" height="6" rx="3" fill="#64748B" />
    <rect x="25" y="228" width="140" height="6" rx="3" fill="#475569" />
  </g>
  
  <g transform="translate(136, 430)">
    <rect width="240" height="42" rx="21" fill="#030712" stroke="#F43F5E" stroke-width="1.5" />
    <text x="120" y="27" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" 
          font-size="15" font-weight="900" fill="#FDA4AF" text-anchor="middle" letter-spacing="2">VIDEO SCRIPT</text>
  </g>
</svg>
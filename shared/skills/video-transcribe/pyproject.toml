[project]
name = "video-transcribe"
version = "1.1.0"
description = "视频转录工具，使用 Whisper、SiliconFlow、阿里百炼或百度 ASR 生成字幕文件"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ffmpeg-python",
    "openai-whisper",
    "faster-whisper",
    "requests",
    "pydub",
    "python-dotenv",
    "dashscope",
]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="自动剪辑台">
  <title>自动剪辑台</title>
  <desc>画面与音轨：一块屏幕加一排波形条</desc>

  <rect width="512" height="512" rx="112" fill="#0E7A55"/>

  <!-- 画面：一块屏幕 -->
  <rect x="96" y="100" width="320" height="200" rx="28" fill="#FFFFFF"/>

  <!-- 播放三角 -->
  <path d="M222 158 L222 242 L296 200 Z" fill="#0E7A55"/>

  <!-- 音轨：一排波形条 -->
  <g fill="#FFFFFF">
    <rect x="96"  y="356" width="30" height="60"  rx="12"/>
    <rect x="154" y="334" width="30" height="104" rx="12"/>
    <rect x="212" y="310" width="30" height="152" rx="12"/>
    <rect x="270" y="338" width="30" height="96"  rx="12"/>
    <rect x="328" y="320" width="30" height="132" rx="12"/>
    <rect x="386" y="350" width="30" height="72"  rx="12"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 圆角方形背景 -->
  <rect x="10" y="10" width="180" height="180" rx="28" ry="28" fill="#C41E2D" />
  
  <!-- 内圈金色边框 -->
  <rect x="24" y="24" width="152" height="152" rx="18" ry="18" fill="none" stroke="#DAA520" stroke-width="2.5" />
  
  <!-- 简化公文/PPT图标 -->
  <!-- 文档折叠效果 -->
  <rect x="60" y="55" width="55" height="65" rx="2" fill="#FFF" opacity="0.92" />
  <polygon points="60,55 85,55 85,78 60,78" fill="#E8D5B7" opacity="0.9" />
  <line x1="68" y1="82" x2="108" y2="82" stroke="#999" stroke-width="1.2" />
  <line x1="68" y1="88" x2="108" y2="88" stroke="#999" stroke-width="1.2" />
  <line x1="68" y1="94" x2="95" y2="94" stroke="#999" stroke-width="1.2" />
  
  <!-- PPT播放图标 -->
  <rect x="100" y="75" width="42" height="30" rx="2" fill="#FFF" opacity="0.85" />
  <polygon points="115,81 115,99 133,90" fill="#C41E2D" opacity="0.9" />
  
  <!-- 底部文字 -->
  <text x="100" y="168" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">公文</text>
  <text x="100" y="183" font-family="sans-serif" font-size="10" fill="#FFD700" text-anchor="middle">→ PPT</text>
</svg>
